name: Latest posts from codelessops.com

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://codelessops.com/rss.xml"
          max_post_count: 5
          template: "$newline- $date · [$title]($url)"
          date_format: "UTC:d mmm yyyy"
          commit_message: "Profile: latest posts from codelessops.com"
